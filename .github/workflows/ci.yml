name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest -v
      - name: Smoke-test against real locale/sshd state on this Linux runner
        run: |
          locale-doctor --version
          locale-doctor --help
          locale-doctor --json > /tmp/report.json || true
          python -m json.tool < /tmp/report.json
          sudo "$(command -v locale-doctor)" || true
      - name: Smoke-test the missing-locale detection path for real
        run: |
          LANG=en_US.UTF-8 LC_TIME=zz_ZZ.UTF-8 locale-doctor --json > /tmp/report2.json || true
          python -m json.tool < /tmp/report2.json
          grep -q "requested_locale_not_installed" /tmp/report2.json

  build-artifact:
    name: Build .pyz + sdist/wheel and smoke-test on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build a standalone .pyz (zipapp)
        run: |
          python -m pip install . --target build/pyz_root
          python -m zipapp build/pyz_root \
            --main "locale_doctor.cli:main" \
            --output dist/locale-doctor.pyz \
            --python "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/locale-doctor.pyz --version
          python3 dist/locale-doctor.pyz --json > /tmp/ld.json || true
          python3 -m json.tool < /tmp/ld.json > /dev/null
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
