[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locale-doctor"
version = "0.1.11"
description = "Diagnose Linux locale misconfiguration: uninstalled requested locales, non-UTF-8 charmap mojibake, and sshd accepting (or ssh_config sending) locale env vars that can't be satisfied."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/locale-doctor"
Changelog = "https://github.com/zhuhroscar-tech/locale-doctor/blob/main/CHANGELOG.md"
Issues = "https://github.com/zhuhroscar-tech/locale-doctor/issues"

[project.scripts]
locale-doctor = "locale_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
